name: StretchGacha

options:
  developmentLanguage: ja
  bundleIdPrefix: com.onclimb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES

targets:
  StretchGacha:
    type: application
    platform: iOS
    sources:
      - StretchGacha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onclimb.StretchGacha
        PRODUCT_NAME: StretchGacha
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: "ストレッチガチャ"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        SWIFT_VERSION: "6.0"
    dependencies:
      - sdk: SwiftData.framework

  StretchGachaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StretchGachaTests
    dependencies:
      - target: StretchGacha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onclimb.StretchGachaTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  StretchGacha:
    build:
      targets:
        StretchGacha: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StretchGachaTests
