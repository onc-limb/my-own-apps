name: StretchDraw

options:
  developmentLanguage: ja
  bundleIdPrefix: com.onclimb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES

targets:
  StretchDraw:
    type: application
    platform: iOS
    sources:
      - StretchDraw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onclimb.StretchDraw
        PRODUCT_NAME: StretchDraw
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Stretch Draw"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
    dependencies:
      - sdk: SwiftData.framework

  StretchDrawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StretchDrawTests
    dependencies:
      - target: StretchDraw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onclimb.StretchDrawTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

  StretchDrawUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StretchDrawUITests
    dependencies:
      - target: StretchDraw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onclimb.StretchDrawUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  StretchDraw:
    build:
      targets:
        StretchDraw: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StretchDrawTests
        - StretchDrawUITests
